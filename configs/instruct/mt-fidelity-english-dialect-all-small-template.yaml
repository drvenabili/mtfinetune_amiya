seed: 42
output_dir: runs/SmolLM-3B-mt-fidelity-english-to-dialect-dialect-to-dialect
log_level: INFO
log_file: runs/SmolLM-3B-mt-fidelity-english-to-dialect-dialect-to-dialect/train.log
log_jsonl: runs/SmolLM-3B-mt-fidelity-english-to-dialect-dialect-to-dialect/metrics.jsonl
model:
  model_id: HuggingFaceTB/SmolLM3-3B
  tokenizer_id: training_data/tokenized/SmolLM3-3B-smaller-template/config/
  dtype: bf16
  tf32: true
  gradient_checkpointing: true
  resize_embeddings_if_needed: true
lora_quant:
  use_lora: false
  quant_bits: 0
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
  lora_bias: none
training:
  num_train_epochs: 4.0
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-05
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  optim: adamw_torch
  dataloader_num_workers: 2
  group_by_length: true
  logging_steps: 10
  save_steps: 1000
  save_total_limit: 1
  eval_steps: 1000
  report_to: none
  auto_resume: true
  resume_from_checkpoint: null
packing:
  pack_sequences: false
  max_length_hint: 2048
metrics:
  on_steps: true
  on_final: true
  gen_max_new_tokens: 512
  gen_temperature: 0.0
  gen_top_p: 1.0
  chrf_eval_n: 64
  trainer_eval_prefer: []
  best_checkpoints:
    - key: "eval_chrfpp_avg_macro"
      mode: "max"
    - key: "eval_loss_avg_macro"
      mode: "min"
datasets:
